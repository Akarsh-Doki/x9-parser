<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>X9 Parser - Done</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="topbar">
        <span th:if="${username}">Signed in as <strong th:text="${username}">admin</strong></span>
        <form method="post" th:action="@{/logout}">
            <button type="submit" class="link-button">Sign out</button>
        </form>
    </div>
        <h1>File parsed successfully</h1>

        <p class="summary">
            Parsed <strong th:text="${summary.checksParsed}">0</strong> checks,
            wrote <strong th:text="${summary.rowsWritten}">0</strong> rows and
            <strong th:text="${summary.imagesWritten}">0</strong> images
            in <span th:text="${summary.millis}">0</span> ms
            (<span th:text="${summary.checksPerSecond}">0</span> checks/sec).
        </p>

        <h2>Output files</h2>
        <table class="images-table">
            <tbody>
                <tr><td>Data (big format)</td><td th:text="${summary.bigCsvPath}">big.csv</td></tr>
                <tr><td>Data (short format)</td><td th:text="${summary.shortCsvPath}">short.csv</td></tr>
                <tr><td>Images</td><td th:text="${summary.imagesDir}">images</td></tr>
            </tbody>
        </table>

        <p><a th:href="@{/}">Parse another file</a></p>
    </div>
</body>
</html>
