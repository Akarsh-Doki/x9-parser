<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>X9 Parser - Upload</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;650&display=swap">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1>X9 File Parser</h1>
        <p class="subtitle">Upload an X9.37 check file to pull out the check data and images.</p>

        <!-- shown only if the last upload failed -->
        <div class="error" th:if="${error}" th:text="${error}"></div>

        <form method="post" th:action="@{/upload}" enctype="multipart/form-data">
            <input type="file" name="file" accept=".x9">
            <button type="submit">Parse file</button>
        </form>
    </div>
</body>
</html>
