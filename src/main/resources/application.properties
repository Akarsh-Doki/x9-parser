spring.application.name=x9parser

# X9 parser configuration
x9.output-dir=./output
x9.input-dir=

x9.credit-debit=Y
x9.onus=Y

# Check Detail (type 25) field layout
x9.check-fields[0].name=Record Type
x9.check-fields[0].start=1
x9.check-fields[0].end=2
x9.check-fields[1].name=Auxiliary On Us
x9.check-fields[1].start=3
x9.check-fields[1].end=17
x9.check-fields[2].name=External Processing Code
x9.check-fields[2].start=18
x9.check-fields[2].end=18
x9.check-fields[3].name=Payor Bank Routing Number
x9.check-fields[3].start=19
x9.check-fields[3].end=26
x9.check-fields[4].name=Payor Bank Routing Number Check Digit
x9.check-fields[4].start=27
x9.check-fields[4].end=27
x9.check-fields[5].name=On Us
x9.check-fields[5].start=28
x9.check-fields[5].end=47
x9.check-fields[6].name=Item Amount
x9.check-fields[6].start=48
x9.check-fields[6].end=57
x9.check-fields[7].name=ECE Institution Item Sequence Number
x9.check-fields[7].start=58
x9.check-fields[7].end=72
x9.check-fields[8].name=Documentation Type Indicator
x9.check-fields[8].start=73
x9.check-fields[8].end=73
x9.check-fields[9].name=Return Acceptance Indicator
x9.check-fields[9].start=74
x9.check-fields[9].end=74
x9.check-fields[10].name=MICR Valid Indicator
x9.check-fields[10].start=75
x9.check-fields[10].end=75
