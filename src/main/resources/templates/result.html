<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>X9 Parser - Results</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1>Parse results</h1>

        <p class="summary">
            Found <strong th:text="${result.checkCount}">0</strong> checks and
            <strong th:text="${result.imageCount}">0</strong> images<span
                th:if="${fileName}"> in <span th:text="${fileName}">file</span></span>.
        </p>

        <p>
            <a class="button" th:href="@{/download/csv}">Download CSV</a>
        </p>

        <h2>Check data</h2>
        <table>
            <thead>
                <tr>
                    <th th:each="column : ${columns}" th:text="${column}">Column</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="check : ${result.checks}">
                    <td th:each="column : ${columns}" th:text="${check.get(column)}">value</td>
                </tr>
            </tbody>
        </table>

        <h2>Images</h2>
        <table class="images-table">
            <thead>
                <tr>
                    <th class="num">Check</th>
                    <th>Side</th>
                    <th>File</th>
                    <th class="num">Size</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="image : ${result.images}">
                    <td class="num" th:text="${image.checkNumber}">1</td>
                    <td><span class="tag" th:text="${image.side.label}">Front</span></td>
                    <td>
                        <a th:href="@{/download/image/{name}(name=${image.fileName})}"
                           th:text="${image.fileName}">check1_F.tif</a>
                    </td>
                    <td class="num" th:text="${image.sizeLabel}">12.3 KB</td>
                </tr>
            </tbody>
        </table>

        <p><a th:href="@{/}">Parse another file</a></p>
    </div>
</body>
</html>
