x9.big-format-columns-resource=big-format-columns.csv

x9.big-format-mapping.ISN=ECE Institution Item Sequence Number
x9.big-format-mapping.Amount=Item Amount
x9.big-format-mapping.Account=On Us
x9.big-format-mapping.EPC=External Processing Code
x9.big-format-mapping.Serial=Auxiliary On Us
x9.big-format-mapping.TxnLink=ECE Institution Item Sequence Number
x9.big-format-mapping.DepAccount=On Us
x9.big-format-mapping.DepAmount=Item Amount

selenium.headless=false
selenium.wait-seconds=30
selenium.screenshot-dir=./target/screenshots

selenium.admin-username=seleniumtest@fcrm.local
selenium.admin-password=${SELENIUM_TEST_PASSWORD:}
selenium.user-username=seleniumuser@fcrm.local
selenium.user-password=${SELENIUM_USER_PASSWORD:}
selenium.x9-file=src/test/resources/sample.x9

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=adoki.work@gmail.com
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.security.oauth2.client.registration.okta.client-id=${OKTA_CLIENT_ID:}
